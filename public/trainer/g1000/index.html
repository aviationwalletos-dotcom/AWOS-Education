<!DOCTYPE html>
<!-- AWOS Glass Cockpit Trainer / PFD  |  BUILD: EDUCATION  (lesson mode: ON) -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AWOS Glass Cockpit Trainer - PFD</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#14161a;color:#d7dbe0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#wrap{padding:8px;display:flex;flex-direction:column;align-items:center}
#fit{width:1264px;height:872px;transform-origin:0 0}
#holder{overflow:hidden}
#bezel{position:relative;width:1264px;height:872px;background:linear-gradient(160deg,#3d4148,#2a2d33 55%,#23262b);border-radius:26px;box-shadow:inset 0 0 0 2px #50555e,inset 0 0 30px #0008;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#scr{position:absolute;left:120px;top:30px;width:1024px;height:768px;background:#000;border:2px solid #0c0d0f;display:block}
.col{position:absolute;top:30px;width:120px;height:768px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:6px 0}
#colL{left:0}#colR{right:0}
.grp{display:flex;flex-direction:column;align-items:center;gap:3px}
.lbl{font-size:12px;font-weight:700;letter-spacing:.5px;color:#eef0f3}
.sub{font-size:8px;color:#b9bec6;letter-spacing:.3px;cursor:pointer;padding:2px 5px;border-radius:3px}
.sub.push{border:1px solid #666c76;background:#30343a}
.sub.push:active{background:#555b65}
.knob{--rot:0deg;position:relative;border-radius:50%;cursor:ew-resize;display:flex;align-items:center;justify-content:center;
 background:repeating-conic-gradient(from var(--rot),#101114 0 4deg,#5d636d 4deg 8deg);box-shadow:0 3px 6px #000c,0 0 0 1.5px #0b0c0e}
.knob::before{content:"";position:absolute;inset:4px;border-radius:50%;background:radial-gradient(circle at 38% 30%,#3b3f46,#1b1d21 72%);box-shadow:inset 0 1px 1px #fff2,inset 0 -2px 3px #0009}
.knob.o{width:62px;height:62px}
.knob.s{width:40px;height:40px}
.knob.v{width:30px;height:30px}
.knob .in{--rot:0deg;position:relative;z-index:1;width:36px;height:36px;border-radius:50%;cursor:ew-resize;
 background:repeating-conic-gradient(from var(--rot),#0c0d0f 0 5deg,#6b717b 5deg 10deg);box-shadow:0 3px 5px #000d,0 0 0 1.5px #08090a}
.knob .in::before,.knob.s::after,.knob.v::after{content:"";position:absolute;inset:4px;border-radius:50%;background:radial-gradient(circle at 38% 30%,#565b64,#22252a 75%);box-shadow:inset 0 1px 1px #fff3,inset 0 -2px 3px #000a;pointer-events:none}
.knob .in::after{content:"";position:absolute;left:50%;top:5px;width:2px;height:7px;margin-left:-1px;background:#cfd3d9;border-radius:1px;transform-origin:1px 13px;transform:rotate(var(--rot));pointer-events:none}
.knob.dim{opacity:.6}
.knob .in.tri{background:linear-gradient(150deg,#7a808a,#2a2d32);clip-path:path("M18 1Q22 1 24.5 5.5L34 24Q37 32 28.5 33L7.5 33Q-1 32 2 24L11.5 5.5Q14 1 18 1Z");transform:rotate(var(--rot));box-shadow:none}
.knob .in.tri::before{inset:0;border-radius:0;clip-path:path("M18 1Q22 1 24.5 5.5L34 24Q37 32 28.5 33L7.5 33Q-1 32 2 24L11.5 5.5Q14 1 18 1Z");transform:scale(.74);transform-origin:18px 21px;background:radial-gradient(circle at 40% 30%,#5d626b,#202327 80%)}
.knob .in.tri::after{top:7px;transform:none}
.key.swap{width:50px;height:28px;padding:0;display:flex;align-items:center;justify-content:center}
.key.swap svg{pointer-events:none}
.arc{display:block;margin-bottom:-3px}
.rng{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:700;color:#eef0f3}
.key{min-width:40px;height:24px;border-radius:5px;border:1px solid #121316;background:linear-gradient(#4a4f58,#33373e);color:#eef0f3;font-size:10px;font-weight:700;cursor:pointer;padding:0 4px;font-family:inherit}
.key:active{background:#6b717c}
.keys{display:grid;grid-template-columns:1fr 1fr;gap:7px 8px}
#pwr{position:absolute;left:36px;top:4px;display:flex;flex-direction:column;align-items:center}
#pwr button{width:22px;height:22px;border-radius:50%;border:1px solid #111;background:radial-gradient(circle at 35% 30%,#777d87,#2a2d32);cursor:pointer}
#pwr span{font-size:8px;font-weight:700;color:#eef0f3}
#sks{position:absolute;left:120px;top:806px;width:1024px;display:grid;grid-template-columns:repeat(12,1fr)}
#sks button{justify-self:center;width:54px;height:36px;border-radius:6px;border:1px solid #111;background:linear-gradient(#4a4f58,#30343a);color:#eef0f3;font-size:16px;cursor:pointer}
#sks button:active{background:#6b717c}
#brand{position:absolute;right:26px;top:8px;font-size:9px;letter-spacing:2px;color:#8d939c;font-weight:700}
#panel{width:100%;max-width:1264px;margin-top:10px;background:#1d2025;border:1px solid #30343b;border-radius:10px;padding:10px 14px;font-size:13px;line-height:1.6}
#panel .row{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
#panel button{background:#343942;color:#eef0f3;border:1px solid #4a505a;border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer;font-family:inherit}
#panel button:active{background:#59606c}
#panel input[type=range]{width:180px}
#panel input[type=number]{width:64px;background:#2a2e35;color:#eef0f3;border:1px solid #4a505a;border-radius:4px;padding:3px 5px;font-family:inherit;font-size:13px}
#panel kbd{background:#343942;border:1px solid #4a505a;border-radius:4px;padding:0 5px;font-size:12px}
#evRes table{border-collapse:collapse;font-size:13px}#evRes td{padding:3px 12px 3px 0;border-bottom:1px solid #30343b}#evRes .ok{color:#3ddc6a;font-weight:700}#evRes .ng{color:#ff6b5e;font-weight:700}
#panel .hint{color:#9aa1ab;font-size:12px;margin-top:6px}
.pad{display:grid;grid-template-columns:repeat(3,40px);grid-template-rows:repeat(2,34px);gap:4px}
.pad button{padding:0}
</style>
</head>
<body>
<div id="wrap">
 <div id="holder"><div id="fit">
  <div id="bezel">
   <div id="pwr"><span>POWER</span><button data-act="power" aria-label="Power"></button></div>
   <div id="brand">AWOS GLASS COCKPIT TRAINER</div>
   <div class="col" id="colL"></div>
   <canvas id="scr" width="1024" height="768"></canvas>
   <div class="col" id="colR"></div>
   <div id="sks"></div>
  </div>
 </div></div>
 <div id="panel">
  <div class="row">
   <div class="pad" aria-label="조종">
    <span></span><button data-hold="d" title="기수 내림">▲</button><span></span>
    <button data-hold="l" title="좌선회">◀</button><button data-hold="u" title="기수 올림">▼</button><button data-hold="r" title="우선회">▶</button>
   </div>
   <label>스로틀 <input id="thr" type="range" min="0" max="100" value="72"> <span id="thrv">72%</span></label>
   <button id="bPause">일시정지</button>
   <button id="bReset">위치 초기화</button>
   <button id="bRand">랜덤 위치</button>
   <button id="bTrk">항적 보기</button>
   <label>바람 <input id="wdir" type="number" min="0" max="360" step="10" value="0"> ° / <input id="wspd" type="number" min="0" max="60" step="1" value="0"> kt</label>
   <button id="bWrnd">랜덤 바람</button>
   <label id="lsnWrap"><input type="checkbox" id="lsn" checked> 레슨 모드</label>
   <span id="stat"></span>
  </div>
  <div class="row" style="margin-top:10px;border-top:1px solid #30343b;padding-top:10px">
   <b>평가 모드</b>
   <button id="bF2F">Fix-to-Fix 과제</button>
   <button id="bHold">홀딩 엔트리 과제</button>
   <button id="bCombo">Fix-to-Fix + 홀딩 과제</button>
   <button id="bIntc">래디얼 인터셉트 과제</button>
   <button id="bArc">DME Arc 과제</button>
   <button id="bEnd">과제 종료·채점</button>
   <label>배속 <select id="spd"><option>1</option><option>2</option><option>4</option></select> x</label>
  </div>
  <div id="evBox" style="display:none;margin-top:8px">
   <div id="evInst" style="font-family:monospace;font-size:15px;color:#fff;background:#0c0d10;border:1px solid #3a3f48;border-radius:6px;padding:8px 10px"></div>
   <div id="evLive" style="color:#9aa1ab;font-size:12px;margin:6px 0"></div>
   <div class="row" style="align-items:flex-start"><canvas id="evCv" width="360" height="360" style="display:none;background:#0c0d10;border:1px solid #3a3f48;border-radius:6px"></canvas><div id="evRes" style="flex:1;min-width:260px"></div></div>
  </div>
  <div class="hint">조종: <kbd>←</kbd><kbd>→</kbd> 뱅크, <kbd>↓</kbd> 기수 올림, <kbd>↑</kbd> 기수 내림, <kbd>PgUp</kbd><kbd>PgDn</kbd> 스로틀, <kbd>P</kbd> 일시정지. 노브: 마우스 휠 또는 좌/우 절반 클릭(바깥 링=큰 단위, 안쪽=작은 단위, HDG는 Shift를 누르면 10도 단위). 누름 동작은 노브 아래 PUSH 버튼. 바람은 자방위 기준이며, 설정하면 PFD WIND 창이 켜집니다. 훈련용이며 실제 항법에 사용할 수 없습니다.</div>
 </div>
</div>
<script>
"use strict";
/* ======================= AWOS 배포 설정 =======================
   AWOS Education 배포: lesson = true
   AWOS Test 배포     : lesson = false  (레슨 모드 전체가 빠집니다)
   Education 빌드에서는 주소에 ?lesson=off 를 붙여 한 세션만 끌 수 있습니다.
   ============================================================== */
const AWOS_BUILD={lesson:true};
const LESSON_BUILD=AWOS_BUILD.lesson&&!/[?&#]lesson=(0|off|false)/i.test(location.search+location.hash);
const W=1024,H=768,D2R=Math.PI/180;
const cv=document.getElementById('scr'),g=cv.getContext('2d');
const n360=a=>((a%360)+360)%360, n180=a=>{a=n360(a);return a>180?a-360:a};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const FONT='"DejaVu Sans Mono","Roboto Mono",Consolas,Menlo,monospace';
const CY='#00e5ff',MG='#ff3df2',GR='#19e619',YL='#ffe100',WH='#fff';

/* ---------- sample nav data (approximate, training only) ---------- */
const VAR=7; /* magnetic variation 7W (AIP RKPD AD 2.19) : magnetic = true + 7 */
const VORS=[{id:'JDG',f:117.90,lat:33.39217,lon:126.71447},{id:'CJU',f:116.10,lat:33.38461,lon:126.62411}];
const APTS=[{id:'RKPD',n:'JEONGSEOK',lat:33.39833,lon:126.71306},{id:'RKPC',n:'JEJU INTL',lat:33.5112,lon:126.4930}];
/* positions are kept in NM on a magnetic-north grid centred on JDG */
VORS.concat(APTS).forEach(o=>{const tx=(o.lon-VORS[0].lon)*60*Math.cos(VORS[0].lat*D2R),ty=(o.lat-VORS[0].lat)*60,c=Math.cos(VAR*D2R),n=Math.sin(VAR*D2R);o.x=tx*c+ty*n;o.y=-tx*n+ty*c;});

/* ---------- state ---------- */
const S={};
function resetFlight(){
 Object.assign(S,{x:-3,y:-11.5,hdg:10,alt:6000,ias:105,pitch:0,roll:0,vs:0,thr:.72,
  ap:false,fd:false,lmode:'ROL',vmode:'PIT',rolRef:0,pitRef:0,altRef:6000,vsRef:0,iasRef:100,flcI:0,
  rollCmd:0,pitchCmd:0,alState:0,alFlash:0,alYellow:false});
 const t=document.getElementById('thr'); if(t){t.value=72;document.getElementById('thrv').textContent='72%';}
}
Object.assign(S,{pwr:1,boot:0,paused:false,keys:{u:0,d:0,l:0,r:0},
 nav1:{a:117.90,s:116.10},nav2:{a:116.10,s:117.90},navSel:1,
 com1:{a:124.350,s:121.950},com2:{a:121.500,s:119.225},comSel:1,
 hdgBug:10,selAlt:6000,baro:29.92,baroU:'IN',meters:false,
 cdi:'VOR1',crs:{VOR1:10,VOR2:10,GPS:0},
 dme:false,lesson:true,w:{d:0,s:0},wopt:3,trk:0,gs:0,brg1:0,brg2:0,menu:'root',win:'',inset:false,dcl:0,rng:3,wind:false,
 xpdr:{code:'1200',mode:'ALT',entry:'',ident:0},tmr:{run:false,t:0}});
resetFlight();
const RANGES=[1,2,5,10,15,25,50,100];

/* ---------- geometry helpers ---------- */
function brgDist(px,py){
 const dy=py-S.y,dx=px-S.x;
 return {brg:n360(Math.atan2(dx,dy)/D2R),dist:Math.hypot(dx,dy)};
}
function navRx(n){
 const f=S['nav'+n].a,st=VORS.find(v=>Math.abs(v.f-f)<.001);
 if(!st)return null; const r=brgDist(st.x,st.y); if(r.dist>60)return null;
 return {st,brg:r.brg,dist:r.dist};
}
/* CDI: dev>0 means course line is to the right (needle right). deg, +-10 full scale */
function cdiState(){
 if(S.cdi==='GPS')return {src:'GPS',valid:false,col:MG,crs:S.crs.GPS};
 const n=S.cdi==='VOR1'?1:2,rx=navRx(n),crs=S.crs[S.cdi];
 if(!rx)return {src:S.cdi,valid:false,col:GR,crs};
 const e=n180(rx.brg-crs),to=Math.abs(e)<=90;
 const dev=to?e:-n180(rx.brg+180-crs);
 return {src:S.cdi,valid:true,col:GR,crs,to,dev:clamp(dev,-12,12),rx};
}
const indAlt=()=>S.alt+(S.baro-29.92)*1000;
const tas=()=>S.ias*(1+Math.max(0,S.alt)/1000*.02);
const alphaOf=v=>2.5*Math.pow(110/Math.max(v,45),2)-2.5;

/* ---------- audio: altitude alert tone only ---------- */
let AC=null;
function unlockAudio(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}}
function tone(){
 try{ if(!AC)return; const t=AC.currentTime,o=AC.createOscillator(),ga=AC.createGain();
  o.type='sine';o.frequency.value=1000;ga.gain.setValueAtTime(0,t);ga.gain.linearRampToValueAtTime(.18,t+.02);
  ga.gain.setValueAtTime(.18,t+.45);ga.gain.linearRampToValueAtTime(0,t+.5);
  o.connect(ga);ga.connect(AC.destination);o.start(t);o.stop(t+.55);}catch(e){}
}

/* ---------- flight model + AFCS ---------- */
function step(dt){
 const V=S.ias,T=tas(),al=alphaOf(V),ia=indAlt();
 // flight director commands
 if(S.fd){
  let hc=null;
  if(S.lmode==='HDG')hc=S.hdgBug;
  else if(S.lmode==='NAV'){const c=cdiState(); if(c.valid)hc=c.crs+clamp(c.dev*7,-45,45); else S.lmode='ROL',S.rolRef=0;}
  S.rollCmd=hc===null?S.rolRef:clamp(n180(hc-S.hdg)*1.5,-22,22);
  let vc=null;
  if(S.vmode==='ALT')vc=clamp((S.altRef-ia)*6,-700,700);
  else if(S.vmode==='VS')vc=S.vsRef;
  if(S.vmode==='FLC'){S.flcI=clamp(S.flcI+(V-S.iasRef)*.12*dt,-10,14);S.pitchCmd=clamp(S.flcI+(V-S.iasRef)*.45,-10,15);}
  else if(vc!==null)S.pitchCmd=al+Math.asin(clamp(vc/(T*101.27),-.3,.3))/D2R;
  else S.pitchCmd=S.pitRef;
  // altitude capture
  if(S.vmode!=='ALT'){const d=S.selAlt-ia; if(d*S.vs>0&&Math.abs(d)<Math.max(40,Math.abs(S.vs)*.12)){S.vmode='ALT';S.altRef=S.selAlt;}}
 }
 if(S.ap){S.roll+=clamp(S.rollCmd-S.roll,-7*dt,7*dt);S.pitch+=clamp(S.pitchCmd-S.pitch,-2.5*dt,2.5*dt);}
 else{const k=S.keys;S.roll+=(k.r-k.l)*18*dt;S.pitch+=(k.u-k.d)*5*dt;}
 S.roll=clamp(S.roll,-60,60);S.pitch=clamp(S.pitch,-20,22);
 const onGnd=S.alt<=0, gam=(S.pitch-al)*D2R;
 S.vs=T*101.27*Math.sin(gam);
 if(onGnd&&S.vs<0){S.vs=0;S.roll=0;if(S.pitch<0)S.pitch=0;}
 S.alt=Math.max(0,S.alt+S.vs*dt/60);
 const x=V/110,drag=onGnd?2.4*x*x+.25:(2.4*x*x+.3/Math.max(x*x,.2))/Math.cos(S.roll*D2R);
 S.ias=clamp(V+(S.thr*3.6-drag-(onGnd?0:19.05*Math.sin(gam)))*dt,0,175);
 S.trate=onGnd?0:1091*Math.tan(S.roll*D2R)/Math.max(T,40);S.hdg=n360(S.hdg+S.trate*dt);
 const d=T*dt/3600,wv=(onGnd?0:S.w.s)*dt/3600;
 S.x+=d*Math.sin(S.hdg*D2R)-wv*Math.sin(S.w.d*D2R); S.y+=d*Math.cos(S.hdg*D2R)-wv*Math.cos(S.w.d*D2R);
 const ws=onGnd?0:S.w.s,gvx=T*Math.sin(S.hdg*D2R)-ws*Math.sin(S.w.d*D2R),gvy=T*Math.cos(S.hdg*D2R)-ws*Math.cos(S.w.d*D2R);
 S.gs=Math.hypot(gvx,gvy);S.trk=n360(Math.atan2(gvx,gvy)/D2R);
 // altitude alerting: 0 far, 1 within 1000, 2 within 200 (captured)
 const dev=Math.abs(indAlt()-S.selAlt);
 if(S.alState===0&&dev<1000){S.alState=1;S.alFlash=5;}
 if(S.alState===1){ if(dev<200){S.alState=2;S.alFlash=5;S.alYellow=false;tone();} else if(dev>1050)S.alState=0; }
 else if(S.alState===2){ if(dev>200&&!S.alYellow){S.alYellow=true;S.alFlash=5;tone();} else if(dev<200)S.alYellow=false; }
 if(S.alFlash>0)S.alFlash-=dt;
 if(S.tmr.run)S.tmr.t+=dt;
 if(S.xpdr.ident>0)S.xpdr.ident-=dt;
 evStep(dt);trkStep(dt);
}
function selAltChanged(){S.alState=0;S.alFlash=0;S.alYellow=false;}

/* ---------- AFCS keys ---------- */
function fdOn(){ if(!S.fd){S.fd=true;S.lmode='ROL';S.rolRef=Math.abs(S.roll)<6?0:clamp(S.roll,-22,22);S.vmode='PIT';S.pitRef=S.pitch;} }
const ACT={
 power(){S.pwr=S.pwr?0:1;S.boot=0;S.menu='root';S.win='';},
 AP(){ if(S.ap){S.ap=false;} else{fdOn();S.ap=true;} },
 FD(){ if(S.fd&&!S.ap){S.fd=false;} else fdOn(); },
 HDG(){fdOn();S.lmode=S.lmode==='HDG'?'ROL':'HDG';S.rolRef=0;},
 NAV(){fdOn(); if(S.lmode==='NAV'){S.lmode='ROL';S.rolRef=0;} else if(cdiState().valid)S.lmode='NAV';},
 ALT(){fdOn(); if(S.vmode==='ALT'){S.vmode='PIT';S.pitRef=S.pitch;} else{S.vmode='ALT';S.altRef=Math.round(indAlt()/10)*10;}},
 VS(){fdOn(); if(S.vmode==='VS'){S.vmode='PIT';S.pitRef=S.pitch;} else{S.vmode='VS';S.vsRef=Math.round(S.vs/100)*100;}},
 FLC(){fdOn(); if(S.vmode==='FLC'){S.vmode='PIT';S.pitRef=S.pitch;} else{S.vmode='FLC';S.iasRef=Math.round(S.ias);S.flcI=S.pitch;}},
 UP(){nose(1);},DN(){nose(-1);},
 VNV(){},APR(){},BC(){},
 navSwap(){const n=S['nav'+S.navSel];[n.a,n.s]=[n.s,n.a]; if(S.lmode==='NAV'&&!cdiState().valid){S.lmode='ROL';S.rolRef=0;}},
 comSwap(){const c=S['com'+S.comSel];[c.a,c.s]=[c.s,c.a];},
 navPush(){S.navSel=3-S.navSel;},comPush(){S.comSel=3-S.comSel;},
 hdgPush(){S.hdgBug=Math.round(S.hdg)%360;},
 crsPush(){ if(S.cdi!=='GPS'){const rx=navRx(S.cdi==='VOR1'?1:2); if(rx)S.crs[S.cdi]=Math.round(rx.brg)%360;} },
 ENT(){ if(S.win==='tmr')S.tmr.run=!S.tmr.run; },
 CLR(){ if(S.win==='tmr'){S.tmr.run=false;S.tmr.t=0;} else S.win=''; },
 DTO(){},MENU(){},FPL(){},PROC(){}
};
function nose(d){
 if(!S.fd)return;
 if(S.vmode==='VS')S.vsRef=clamp(S.vsRef+d*100,-2000,1500);
 else if(S.vmode==='FLC')S.iasRef=clamp(S.iasRef-d,65,160);
 else if(S.vmode==='PIT')S.pitRef=clamp(S.pitRef+d*.5,-15,20);
}
function knob(name,ring,d){

 K('vol','',  'v','','',true)+'<button class="key swap" data-act="navSwap" aria-label="Frequency transfer"><svg width="40" height="18" viewBox="0 0 40 18" aria-hidden="true"><path d="M1 9l9-8v5h20V1l9 8-9 8v-5H10v5z" fill="#eef0f3"/></svg></button>'+
 K('nav','NAV','o','PUSH 1-2','navPush')+K('hdg','HDG','s','PUSH HDG SYNC','hdgPush')+
 '<div class="keys">'+key('AP','AP')+key('FD','FD')+key('HDG','HDG')+key('ALT','ALT')+key('NAV','NAV')+key('VNV','VNV')+key('APR','APR')+key('BC','BC')+key('VS','VS')+key('UP','UP')+key('FLC','FLC')+key('DN','DN')+'</div>'+
 K('alt','ALT','o','','');
document.getElementById('colR').innerHTML=
 K('vol','','v','','',true)+'<button class="key swap" data-act="comSwap" aria-label="Frequency transfer"><svg width="40" height="18" viewBox="0 0 40 18" aria-hidden="true"><path d="M1 9l9-8v5h20V1l9 8-9 8v-5H10v5z" fill="#eef0f3"/></svg></button>'+
 K('com','COM','o','PUSH 1-2','comPush')+K('crsbaro','CRS / BARO','o','PUSH CRS CTR','crsPush')+K('range','RANGE','s','','')+
 '<div class="keys">'+key('D→','DTO')+key('MENU','MENU')+key('FPL','FPL')+key('PROC','PROC')+key('CLR','CLR')+key('ENT','ENT')+'</div>'+
 K('fms','FMS','o','','',true);
document.getElementById('sks').innerHTML=Array.from({length:12},(_,i)=>'<button data-sk="'+i+'" aria-label="Softkey '+(i+1)+'">△</button>').join('');

const bezel=document.getElementById('bezel');
function turn(el,d,shift){el._r=(el._r||0)+d*12;el.style.setProperty('--rot',el._r+'deg');knob(el.dataset.knob,shift&&el.dataset.knob==='hdg'?'o':el.dataset.ring,d);}
bezel.addEventListener('click',e=>{
 unlockAudio();
 const t=e.target;
 if(t.dataset.sk!==undefined){softkey(+t.dataset.sk);return;}
 if(t.dataset.act){ if(t.dataset.act==='power'||(S.pwr&&S.boot>=2.5))ACT[t.dataset.act](); return; }
 if(t.dataset.knob){const r=t.getBoundingClientRect();turn(t,e.clientX<r.left+r.width/2?-1:1,e.shiftKey);}
});
bezel.addEventListener('wheel',e=>{const t=e.target;if(t.dataset&&t.dataset.knob){e.preventDefault();turn(t,e.deltaY<0?1:-1,e.shiftKey);}},{passive:false});

const KM={ArrowLeft:'l',ArrowRight:'r',ArrowDown:'u',ArrowUp:'d'};
const thrEl=document.getElementById('thr'),thrV=document.getElementById('thrv');
function setThr(v){S.thr=clamp(v,0,1);thrEl.value=Math.round(S.thr*100);thrV.textContent=Math.round(S.thr*100)+'%';}
addEventListener('keydown',e=>{unlockAudio();
 if(KM[e.key]){S.keys[KM[e.key]]=1;e.preventDefault();}
 else if(e.key==='PageUp'){setThr(S.thr+.05);e.preventDefault();}
 else if(e.key==='PageDown'){setThr(S.thr-.05);e.preventDefault();}
 else if(e.key==='p'||e.key==='P')S.paused=!S.paused;});
addEventListener('keyup',e=>{if(KM[e.key])S.keys[KM[e.key]]=0;});
thrEl.addEventListener('input',()=>setThr(thrEl.value/100));
document.querySelectorAll('[data-hold]').forEach(b=>{const k=b.dataset.hold;
 b.addEventListener('pointerdown',e=>{unlockAudio();S.keys[k]=1;e.preventDefault();});
 ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>S.keys[k]=0));});
document.getElementById('bPause').addEventListener('click',()=>S.paused=!S.paused);
document.getElementById('bReset').addEventListener('click',()=>{evCancel();resetFlight();S.hdgBug=10;S.selAlt=6000;selAltChanged();TRK.length=0;});

function applyWind(){S.w.d=n360(+$('wdir').value||0);S.w.s=clamp(+$('wspd').value||0,0,60);if(S.w.s>0)S.wind=true;}
['wdir','wspd'].forEach(id=>{$(id).addEventListener('input',applyWind);$(id).addEventListener('change',applyWind);});
$('bWrnd').addEventListener('click',()=>{$('wdir').value=10*Math.floor(Math.random()*36);$('wspd').value=5+Math.floor(Math.random()*21);applyWind();});
if(LESSON_BUILD){$('lsn').addEventListener('change',e=>{S.lesson=e.target.checked;});}
else{$('lsnWrap').style.display='none';S.lesson=false;}
$('bRand').addEventListener('click',randomPos);$('bTrk').addEventListener('click',showTrack);$('bF2F').addEventListener('click',startF2F);$('bHold').addEventListener('click',()=>startHold(false));$('bCombo').addEventListener('click',()=>startHold(true));$('bIntc').addEventListener('click',startIntc);$('bArc').addEventListener('click',startArc);$('bEnd').addEventListener('click',evFinish);$('spd').addEventListener('change',e=>SPD=+e.target.value);
function fit(){const s=Math.min(1,(document.documentElement.clientWidth-16)/1264),f=document.getElementById('fit'),h=document.getElementById('holder');
 f.style.transform='scale('+s+')';h.style.width=1264*s+'px';h.style.height=872*s+'px';}
addEventListener('resize',fit);fit();
requestAnimationFrame(frame);
</script>
</body>
</html>
